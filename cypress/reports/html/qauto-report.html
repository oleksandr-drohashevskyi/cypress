<!doctype html>
<html lang="en"><head><meta charSet="utf-8"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Mochawesome Report</title><link rel="stylesheet" href="assets\app.css"/></head><body data-raw="{&quot;stats&quot;:{&quot;suites&quot;:1,&quot;tests&quot;:1,&quot;passes&quot;:1,&quot;pending&quot;:0,&quot;failures&quot;:0,&quot;testsRegistered&quot;:1,&quot;passPercent&quot;:100,&quot;pendingPercent&quot;:0,&quot;other&quot;:0,&quot;hasOther&quot;:false,&quot;skipped&quot;:0,&quot;hasSkipped&quot;:false,&quot;start&quot;:&quot;2026-01-29T22:57:07.178Z&quot;,&quot;end&quot;:&quot;2026-01-29T22:57:13.694Z&quot;,&quot;duration&quot;:6516},&quot;results&quot;:[{&quot;uuid&quot;:&quot;0d48efdc-95bd-42c5-8421-e85109afc683&quot;,&quot;title&quot;:&quot;&quot;,&quot;fullFile&quot;:&quot;cypress\\e2e\\lesson-22\\car_intercept_api_expense.cy.js&quot;,&quot;file&quot;:&quot;cypress\\e2e\\lesson-22\\car_intercept_api_expense.cy.js&quot;,&quot;beforeHooks&quot;:[],&quot;afterHooks&quot;:[],&quot;tests&quot;:[],&quot;suites&quot;:[{&quot;uuid&quot;:&quot;47f14f97-c5a5-4ab8-be74-e90486609818&quot;,&quot;title&quot;:&quot;Lesson 22: Intercept car creation + API checks + API expense + UI validation&quot;,&quot;fullFile&quot;:&quot;cypress\\e2e\\lesson-22\\car_intercept_api_expense.cy.js&quot;,&quot;file&quot;:&quot;cypress\\e2e\\lesson-22\\car_intercept_api_expense.cy.js&quot;,&quot;beforeHooks&quot;:[],&quot;afterHooks&quot;:[],&quot;tests&quot;:[{&quot;title&quot;:&quot;should create car via UI (intercept), verify in GET /api/cars, create expense via API, verify via UI&quot;,&quot;fullTitle&quot;:&quot;Lesson 22: Intercept car creation + API checks + API expense + UI validation should create car via UI (intercept), verify in GET /api/cars, create expense via API, verify via UI&quot;,&quot;timedOut&quot;:null,&quot;duration&quot;:6397,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;medium&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;context&quot;:null,&quot;code&quot;:&quot;const car = {\n  brand: \&quot;Audi\&quot;,\n  model: \&quot;TT\&quot;,\n  mileage: \&quot;122\&quot;\n};\n// 1) INTERCEPT создания машины\ncy.intercept(\&quot;POST\&quot;, \&quot;**/api/cars\&quot;).as(\&quot;createCar\&quot;);\n_GaragePage.garagePage.addCar(car);\n_GaragePage.garagePage.carShouldExist(car);\ncy.wait(\&quot;@createCar\&quot;).then(({\n  response\n}) =&gt; {\n  expect(response.statusCode).to.eq(201);\n  expect(response.body.status).to.eq(\&quot;ok\&quot;);\n  const created = response.body.data;\n  expect(created).to.have.property(\&quot;id\&quot;);\n  // сохраняем id\n  cy.wrap(created.id).as(\&quot;carId\&quot;);\n  // ✅ дата для expense: берем updatedMileageAt и превращаем в YYYY-MM-DD\n  const createdDateISO = new Date(created.updatedMileageAt).toISOString().slice(0, 10);\n  cy.wrap(createdDateISO).as(\&quot;carCreatedDate\&quot;);\n  // опционально — в фикстуру\n  cy.writeFile(\&quot;cypress/fixtures/createdCar.json\&quot;, _objectSpread({\n    id: created.id,\n    createdDate: createdDateISO\n  }, car));\n});\n// 2) GET /api/cars и проверка, что в списке есть созданная машина\ncy.get(\&quot;@carId\&quot;).then(carId =&gt; {\n  cy.apiGetCars().then(resp =&gt; {\n    expect(resp.status).to.eq(200);\n    expect(resp.body.status).to.eq(\&quot;ok\&quot;);\n    expect(resp.body.data).to.be.an(\&quot;array\&quot;);\n    const found = resp.body.data.find(c =&gt; String(c.id) === String(carId));\n    expect(found, \&quot;created car exists in GET /api/cars\&quot;).to.exist;\n    expect(found.brand).to.eq(car.brand);\n    expect(found.model).to.eq(car.model);\n    expect(String(found.mileage)).to.eq(String(car.mileage));\n  });\n});\n// 3) POST /api/expenses через кастомную команду\ncy.get(\&quot;@carId\&quot;).then(carId =&gt; {\n  cy.get(\&quot;@carCreatedDate\&quot;).then(createdDate =&gt; {\n    const expense = {\n      carId,\n      reportedAt: createdDate,\n      // ✅ гарантированно не раньше даты создания\n      mileage: 12350,\n      liters: 40,\n      totalCost: 200\n    };\n    cy.apiCreateExpense(expense).then(resp =&gt; {\n      expect(resp.status).to.be.oneOf([200, 201]);\n      expect(resp.body.status).to.eq(\&quot;ok\&quot;);\n      const data = resp.body.data;\n      expect(data).to.have.property(\&quot;id\&quot;);\n      expect(String(data.carId)).to.eq(String(expense.carId));\n      expect(String(data.mileage)).to.eq(String(expense.mileage));\n      expect(String(data.liters)).to.eq(String(expense.liters));\n      expect(String(data.totalCost)).to.eq(String(expense.totalCost));\n      cy.wrap(expense).as(\&quot;expenseData\&quot;);\n    });\n  });\n});\n// 4) UI: найти нужную машину и проверить expense по параметрам\n// Переходим в \&quot;Fuel expenses\&quot; через UI\ncy.contains(\&quot;Fuel expenses\&quot;).click();\ncy.get(\&quot;@expenseData\&quot;).then(expense =&gt; {\n  _ExpensesPage.expensesPage.expenseShouldExist({\n    mileage: String(expense.mileage)\n  });\n  cy.contains(\&quot;td\&quot;, String(expense.liters)).should(\&quot;exist\&quot;);\n  cy.contains(\&quot;td\&quot;, String(expense.totalCost)).should(\&quot;exist\&quot;);\n});&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;f57a7d42-a59e-45b2-92c5-70e4484a23f5&quot;,&quot;parentUUID&quot;:&quot;47f14f97-c5a5-4ab8-be74-e90486609818&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false}],&quot;suites&quot;:[],&quot;passes&quot;:[&quot;f57a7d42-a59e-45b2-92c5-70e4484a23f5&quot;],&quot;failures&quot;:[],&quot;pending&quot;:[],&quot;skipped&quot;:[],&quot;duration&quot;:6397,&quot;root&quot;:false,&quot;rootEmpty&quot;:false,&quot;_timeout&quot;:2000}],&quot;passes&quot;:[],&quot;failures&quot;:[],&quot;pending&quot;:[],&quot;skipped&quot;:[],&quot;duration&quot;:0,&quot;root&quot;:true,&quot;rootEmpty&quot;:true,&quot;_timeout&quot;:2000}],&quot;meta&quot;:{&quot;mocha&quot;:{&quot;version&quot;:&quot;7.2.0&quot;},&quot;mochawesome&quot;:{&quot;options&quot;:{&quot;quiet&quot;:false,&quot;reportFilename&quot;:&quot;qauto-report&quot;,&quot;saveHtml&quot;:false,&quot;saveJson&quot;:true,&quot;consoleReporter&quot;:&quot;spec&quot;,&quot;useInlineDiffs&quot;:false,&quot;code&quot;:true},&quot;version&quot;:&quot;7.1.4&quot;},&quot;marge&quot;:{&quot;options&quot;:{&quot;reportFilename&quot;:&quot;qauto-report&quot;,&quot;overwrite&quot;:false,&quot;html&quot;:false,&quot;json&quot;:true,&quot;reportDir&quot;:&quot;cypress\\reports\\html\\.jsons&quot;},&quot;version&quot;:&quot;6.3.2&quot;}}}" data-config="{&quot;reportFilename&quot;:&quot;qauto-report&quot;,&quot;reportDir&quot;:&quot;C:\\Users\\Alex\\Projects\\Node\\cypress\\cypress\\reports\\html&quot;,&quot;reportTitle&quot;:&quot;cypress&quot;,&quot;reportPageTitle&quot;:&quot;Mochawesome Report&quot;,&quot;inline&quot;:false,&quot;inlineAssets&quot;:false,&quot;cdn&quot;:false,&quot;charts&quot;:false,&quot;enableCharts&quot;:false,&quot;code&quot;:true,&quot;enableCode&quot;:true,&quot;autoOpen&quot;:false,&quot;overwrite&quot;:true,&quot;timestamp&quot;:false,&quot;ts&quot;:false,&quot;showPassed&quot;:true,&quot;showFailed&quot;:true,&quot;showPending&quot;:true,&quot;showSkipped&quot;:false,&quot;showHooks&quot;:&quot;failed&quot;,&quot;saveJson&quot;:false,&quot;saveHtml&quot;:true,&quot;dev&quot;:false,&quot;assetsDir&quot;:&quot;C:\\Users\\Alex\\Projects\\Node\\cypress\\cypress\\reports\\html\\assets&quot;,&quot;htmlFile&quot;:&quot;C:\\Users\\Alex\\Projects\\Node\\cypress\\cypress\\reports\\html\\qauto-report.html&quot;}"><div id="report"></div><script src="assets\app.js"></script></body></html>
